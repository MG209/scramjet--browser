<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breeze Transparent</title>
  <style>
    /* Default background color if you don't use an image yet */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      padding-top: 15%; 
      background: #0d1117; 
      margin: 0;
      height: 100vh;
      background-size: cover;
      background-position: center;
    }

    h1 { 
      font-size: 2.8rem; 
      margin-bottom: 25px; 
      color: #ffffff; 
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Glassmorphism Design: Transparent blurred container */
    .box { 
      display: flex; 
      max-width: 550px; 
      margin: 0 auto; 
      background: rgba(255, 255, 255, 0.06); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px; 
      border-radius: 30px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    input { 
      flex: 1; 
      border: none; 
      background: transparent; 
      color: white; 
      padding: 12px 20px; 
      font-size: 16px; 
      outline: none; 
    }

    /* Keeps placeholder text clean and subtle */
    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    button { 
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; 
      padding: 12px 28px; 
      border-radius: 25px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { 
      background: rgba(255, 255, 255, 0.35); 
      transform: scale(1.02);
    }

    p { 
      color: rgba(255, 255, 255, 0.4); 
      font-size: 14px; 
      margin-top: 20px; 
      text-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <h1>Breeze Transparent</h1>
  
  <div class="box">
    <form id="gateway-form" style="display: flex; width: 100%;">
      <input type="text" id="url-field" placeholder="Search web or enter URL..." required>
      <button type="submit">Launch</button>
    </form>
  </div>
  
  <p>Breeze network framework activated.</p>

  <script>
    document.getElementById('gateway-form').onsubmit = (e) => {
      e.preventDefault();
      let target = document.getElementById('url-field').value.trim();
      
      // If it isn't a direct URL format, turn it into a Google search query
      if (!target.includes('.') || target.includes(' ')) {
        target = '://google.com' + encodeURIComponent(target);
      }
      
      // Clean the formatting prefix safely
      target = target.replace(/^(https?:\/\/)?(www\.)?/, '');
      
      // Routes traffic through the Google translation secure mirror system
      window.location.href = "https://google.com" + encodeURIComponent("https://" + target);
    };
  </script>

</body>
</html>
