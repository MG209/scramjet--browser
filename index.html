<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stealth Browser</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 12%; background: #0b0f19; color: #f3f4f6; margin: 0; }
    h1 { font-size: 2.2rem; margin-bottom: 20px; color: #3b82f6; }
    .box { display: flex; max-width: 550px; margin: 0 auto; background: #1f2937; padding: 6px; border-radius: 8px; border: 1px solid #374151; }
    input { flex: 1; border: none; background: transparent; color: white; padding: 10px 15px; font-size: 16px; outline: none; }
    button { background: #3b82f6; border: none; color: white; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2563eb; }
    p { color: #9ca3af; font-size: 13px; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>My Stealth Browser</h1>
  
  <div class="box">
    <form id="gateway-form" style="display: flex; width: 100%;">
      <input type="text" id="url-field" placeholder="Enter URL (e.g., google.com)..." required>
      <button type="submit">Launch</button>
    </form>
  </div>
  
  <p>Bypassing network blocks via secure translation nodes.</p>

  <script>
    document.getElementById('gateway-form').onsubmit = (e) => {
      e.preventDefault();
      let target = document.getElementById('url-field').value.trim();
      
      // Clean the URL formatting
      target = target.replace(/^(https?:\/\/)?(www\.)?/, '');
      
      // Routes traffic through an official Google translation proxy node
      window.location.href = "https://google.com" + encodeURIComponent("https://" + target);
    };
  </script>

</body>
</html>
