<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breeze</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      /* Automatically pulls your uploaded blue image as a full-cover wallpaper */
      background: url('bg.png') no-repeat center center fixed; 
      background-size: cover;
      color: #ffffff; 
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tab Bar Styling Container - Translucent Glass Blend */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 10px 0 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      gap: 5px;
      align-items: flex-end;
    }

    .tab {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      user-select: none;
      transition: background 0.2s;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-weight: bold;
      border-color: rgba(255, 255, 255, 0.25);
      position: relative;
      z-index: 2;
    }

    .close-tab {
      font-weight: bold;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }
    .close-tab:hover { color: #ff5f56; }

    .new-tab-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .new-tab-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Main Container Content Window */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1 { 
      font-size: 3.5rem; 
      margin-bottom: 25px; 
      color: #ffffff; 
      letter-spacing: -1px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Frosted Semi-Transparent Search Box */
    .box { 
      display: flex; 
      width: 100%;
      max-width: 580px; 
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px; 
      border-radius: 30px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      margin-bottom: 25px;
    }

    input { 
      flex: 1; 
      border: none; 
      background: transparent; 
      color: #ffffff; 
      padding: 12px 20px; 
      font-size: 16px; 
      outline: none; 
    }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }

    button.launch-btn { 
      background: rgba(255, 255, 255, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff; 
      padding: 12px 28px; 
      border-radius: 25px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s;
    }
    button.launch-btn:hover { 
      background: rgba(255, 255, 255, 0.3); 
      transform: scale(1.02);
    }

    /* Popular Apps Grid Menu */
    .apps-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 580px;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .app-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    p { color: rgba(255, 255, 255, 0.5); font-size: 13px; margin-top: 30px; }
  </style>
</head>
<body>

  <div class="tab-bar" id="tabBar">
    <div class="tab active" onclick="switchTab(this)">
      <span class="tab-title">Tab 1</span>
      <span class="close-tab" onclick="closeTab(event, this)">×</span>
    </div>
    <button class="new-tab-btn" onclick="createNewTab()">+</button>
  </div>
  
  <div class="content-area">
    <h1>Breeze</h1>
    
    <div class="box">
      <form id="gateway-form" style="display: flex; width: 100%;">
        <input type="text" id="url-field" placeholder="Search unblocked web cleanly..." required autocomplete="off">
        <button type="submit" class="launch-btn">Launch</button>
      </form>
    </div>

    <!-- Quick Link App Grid -->
    <div class="apps-container">
      <a class="app-card" onclick="launchShortcut('youtube')">YouTube</a>
      <a class="app-card" onclick="launchShortcut('discord')">Discord</a>
      <a class="app-card" onclick="launchApp('tiktok')">TikTok</a>
      <a class="app-card" onclick="launchShortcut('google')">Google</a>
      <a class="app-card" onclick="launchShortcut('github')">GitHub</a>
    </div>
    
    <p>Breeze tab system matrix activated.</p>
  </div>

  <script>
    let tabCount = 1;

    function createNewTab() {
      tabCount++;
      const tabBar = document.getElementById('tabBar');
      const addBtn = tabBar.querySelector('.new-tab-btn');
      
      const newTab = document.createElement('div');
      newTab.className = 'tab';
      newTab.onclick = function() { switchTab(this); };
      newTab.innerHTML = `<span class="tab-title">Tab ${tabCount}</span><span class="close-tab" onclick="closeTab(event, this)">×</span>`;
      
      tabBar.insertBefore(newTab, addBtn);
      setActiveTab(newTab);
      document.getElementById('url-field').value = '';
    }

    function switchTab(tabElement) { setActiveTab(tabElement); }

    function setActiveTab(tabElement) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tabElement.classList.add('active');
    }

    function closeTab(event, closeButton) {
      event.stopPropagation(); 
      const tabElement = closeButton.parentElement;
      const allTabs = document.querySelectorAll('.tab');
      if (allTabs.length === 1) return;
      if (tabElement.classList.contains('active')) {
        const index = Array.from(allTabs).indexOf(tabElement);
        const nextActive = allTabs[index + 1] || allTabs[index - 1];
        if (nextActive) setActiveTab(nextActive);
      }
      tabElement.remove();
    }

    function routeStealthStream(rawQuery) {
      const activeTab = document.querySelector('.tab.active .tab-title');
      if (activeTab) { activeTab.innerText = rawQuery.substring(0, 10); }

      let safePath = "https://duckduckgo.com" + encodeURIComponent(rawQuery);
      window.location.href = "https://allorigins.win" + encodeURIComponent(safePath);
    }

    document.getElementById('gateway-form').onsubmit = (e) => {
      e.preventDefault();
      const inputVal = document.getElementById('url-field').value.trim();
      routeStealthStream(inputVal);
    };

    function launchShortcut(appName) {
      routeStealthStream(appName);
    }
  </script>

</body>
</html>
