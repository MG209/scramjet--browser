<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeze Functional Browser</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation and Tab Bar */
        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-weight: bold;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem;
        }

        /* Input URL Bar */
        .address-bar {
            flex-grow: 1;
            display: flex;
            gap: 0.5rem;
        }

        .address-bar input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        .address-bar button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Quick Bookmark Links */
        .bookmarks {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.2);
        }

        .bookmark-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .bookmark-btn:hover {
            color: #38bdf8;
        }

        /* Main Viewport Workspace */
        .browser-viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        /* Embedded Browser Frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Error/Info Panel overlay if frame fails */
        .frame-notice {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 0.5rem;
            font-size: 0.8rem;
            border-radius: 4px;
            pointer-events: none;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <!-- Browser Controls Header -->
    <header>
        <div class="logo">Breeze</div>
        <div class="address-bar">
            <input type="text" id="url-input" value="https://example.com" placeholder="Enter web address (must start with https://)...">
            <button onclick="navigateToUrl()">Go</button>
        </div>
    </header>

    <!-- Quick Launch Bookmarks Menu -->
    <div class="bookmarks">
        <button class="bookmark-btn" onclick="quickLoad('https://example.com')">Example Site</button>
        <button class="bookmark-btn" onclick="quickLoad('https://wikipedia.org')">Wikipedia</button>
        <button class="bookmark-btn" onclick="quickLoad('https://archive.org')">Internet Archive</button>
    </div>

    <!-- Active Browser Display Canvas -->
    <div class="browser-viewport">
        <iframe id="browser-frame" src="https://example.com"></iframe>
        <div class="frame-notice">Note: If a site remains blank, it restricts iframe embedding.</div>
    </div>

    <script>
        // Function to load URLs from the custom navigation search bar
        function navigateToUrl() {
            const input = document.getElementById('url-input');
            let url = input.value.trim();

            // Enforce basic URL protocol configuration standard
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            document.getElementById('browser-frame').src = url;
            input.value = url;
        }

        // Action routing helper for instant shortcut triggers
        function quickLoad(targetUrl) {
            document.getElementById('url-input').value = targetUrl;
            document.getElementById('browser-frame').src = targetUrl;
        }

        // Listen for enter-key submissions inside the input field
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigateToUrl();
            }
        });
    </script>
</body>
</html>
