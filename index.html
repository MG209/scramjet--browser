<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breeze</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      /* Perfectly balances with your blue gradient striped texture image */
      background: linear-gradient(180deg, #1e69de 0%, #154fb3 50%, #0d3170 100%);
      color: #ffffff; 
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tab Bar Styling Container - Translucent Glass Blend */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 10px 0 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      gap: 5px;
      align-items: flex-end;
    }

    .tab {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.65);
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      user-select: none;
      transition: background 0.2s;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-weight: bold;
      border-color: rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 2;
    }

    .close-tab {
      font-weight: bold;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }
    .close-tab:hover { color: #ff5f56; }

    .new-tab-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .new-tab-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* Frosted Sticky Top URL Bar Controller Header */
    .nav-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
      gap: 10px;
    }

    .url-bar-container {
      flex: 1;
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 15px;
      align-items: center;
    }

    .url-bar-container input {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .url-bar-container input::placeholder { color: rgba(255, 255, 255, 0.4); }

    .nav-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 18px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Dynamic Body Window Display Area Layout */
    .main-viewport {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Transparent Glassmorphism Center Screen Box */
    .home-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 5;
    }

    h1 { 
      font-size: 3.5rem; 
      margin-bottom: 25px; 
      color: #ffffff; 
      letter-spacing: -1px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    /* Frosted Glass Input Container */
    .box { 
      display: flex; 
      width: 100%;
      max-width: 580px; 
      background: rgba(255, 255, 255, 0.07); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px; 
      border-radius: 30px; 
      border: 1px solid rgba(255, 255, 255, 0.18); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
      margin-bottom: 25px;
    }

    .box input {
      flex: 1;
      border: none;
      background: transparent;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      outline: none;
    }
    .box input::placeholder { color: rgba(255, 255, 255, 0.5); }

    button.launch-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Popular Apps Grid Menu */
    .apps-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 580px;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 24px;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .app-card:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-3px);
    }

    /* Embedded Internal Viewport Monitor Window */
    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
      z-index: 1;
    }

    p { color: rgba(255, 255, 255, 0.4); font-size: 13px; margin-top: 30px; }
  </style>
</head>
<body>

  <!-- Dynamic Tab Control Navigation -->
  <div class="tab-bar" id="tabBar">
    <div class="tab active" onclick="switchTab(this)" data-tab-id="1">
      <span class="tab-title">New Tab</span>
      <span class="close-tab" onclick="closeTab(event, this)">×</span>
    </div>
    <button class="new-tab-btn" onclick="createNewTab()">+</button>
  </div>

  <!-- Live Sticky Address Header Row -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="goHome()">Home</button>
    <form id="nav-form" style="display: flex; flex: 1; gap: 10px;" onsubmit="handleNavSubmit(event)">
      <div class="url-bar-container">
        <input type="text" id="url-input" placeholder="Type search parameter or URL address here..." autocomplete="off">
      </div>
      <button type="submit" class="nav-btn">Go</button>
    </form>
  </div>
  
  <!-- Active Viewport Display Module Matrix -->
  <div class="main-viewport">
    
    <!-- Home Selection Layer Screen -->
    <div class="home-screen" id="homeScreen">
      <h1>Breeze</h1>
      <div class="box">
        <form id="gateway-form" style="display: flex; width: 100%;" onsubmit="handleHomeSubmit(event)">
          <input type="text" id="url-field" placeholder="Search unblocked web cleanly..." required autocomplete="off">
          <button type="submit" class="launch-btn">Launch</button>
        </form>
      </div>

      <div class="apps-container">
        <a class="app-card" onclick="launchShortcut('youtube')">YouTube</a>
        <a class="app-card" onclick="launchShortcut('discord')">Discord</a>
        <a class="app-card" onclick="launchShortcut('tiktok')">TikTok</a>
        <a class="app-card" onclick="launchShortcut('google')">Google</a>
        <a class="app-card" onclick="launchShortcut('github')">GitHub</a>
      </div>
      <p>Breeze glass tab framework online.</p>
    </div>

    <!-- Website Display Portal Window Frame -->
    <iframe class="browser-frame" id="browserFrame"></iframe>

  </div>

  <script>
    let tabCount = 1;
    let tabsData = {
      "1": { url: "", isHome: true, label: "New Tab" }
    };
    let activeTabId = "1";

    function createNewTab() {
      tabCount++;
      const id = tabCount.toString();
      tabsData[id] = { url: "", isHome: true, label: "New Tab" };

      const tabBar = document.getElementById('tabBar');
      const addBtn = tabBar.querySelector('.new-tab-btn');
      
      const newTab = document.createElement('div');
      newTab.className = 'tab';
      newTab.setAttribute('data-tab-id', id);
      newTab.setAttribute('onclick', 'switchTab(this)');
      newTab.innerHTML = `<span class="tab-title">New Tab</span><span class="close-tab" onclick="closeTab(event, this)">×</span>`;
      
      tabBar.insertBefore(newTab, addBtn);
      switchTab(newTab);
    }

    function switchTab(tabElement) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tabElement.classList.add('active');
      
      activeTabId = tabElement.getAttribute('data-tab-id');
      const data = tabsData[activeTabId];

      document.getElementById('url-input').value = data.url.includes('?q=') ? decodeURIComponent(data.url.split('?q=')[1]) : data.url;
      document.getElementById('url-field').value = document.getElementById('url-input').value;

      if (data.isHome) {
        document.getElementById('homeScreen').style.display = "flex";
        document.getElementById('browserFrame').style.display = "none";
      } else {
        document.getElementById('homeScreen').style.display = "none";
        document.getElementById('browserFrame').style.display = "block";
        document.getElementById('browserFrame').src = data.url;
      }
    }

    function closeTab(event, closeButton) {
      event.stopPropagation();
      const tabElement = closeButton.parentElement;
      const id = tabElement.getAttribute('data-tab-id');
      const allTabs = document.querySelectorAll('.tab');
      
      if (allTabs.length === 1) return;

      delete tabsData[id];

      if (tabElement.classList.contains('active')) {
        const index = Array.from(allTabs).indexOf(tabElement);
